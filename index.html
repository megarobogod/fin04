<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Chambers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <canvas id="screen" width="480" height="270"></canvas>
    <canvas id="cine" width="1280" height="720" hidden></canvas>

    <div id="hud" hidden>
      <div id="top"><span id="floor"></span> &nbsp; VIPERS LEFT <b id="enemies">0</b></div>
      <div id="msg"></div>
      <div id="reload"></div>
      <div id="style"><b id="rank"></b><i><em id="stylebar"></em></i><span id="slabel"></span><small id="score">0</small></div>
      <div id="dash"></div>
      <div id="health"><span>HEALTH</span> <b id="hp">100</b><i><em id="hpbar"></em></i></div>
      <div id="ammo"><small id="wname">REVOLVER</small><span id="cyl"></span> <b id="reserve">24</b></div>
    </div>

    <div id="subs" hidden></div>
    <div id="skip" hidden>CLICK: NEXT &nbsp; SPACE: SKIP</div>

    <div id="overlay" class="screen"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
