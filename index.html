<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #10140f;
    color: #e8efe4;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  h1 { font-size: clamp(1.6rem, 6vw, 2.6rem); margin: 0 0 .4em; letter-spacing: -0.02em; }
  p { margin: 0 auto; max-width: 32ch; color: #a8b6a0; }
  .tick { font-size: 2.5rem; display: block; margin-bottom: .3em; }
</style>
</head>
<body>
  <main>
    <span class="tick">&#127795;</span>
    <h1>Set up and deploying</h1>
    <p>The repo and hosting are connected. The game goes here next.</p>
  </main>
</body>
</html>
